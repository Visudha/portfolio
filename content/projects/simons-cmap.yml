title: Collaborative Marine Atlas Project (CMAP)
slug: simons-cmap
order: 5
published: true
eyebrow: UX design and usability testing
subtitle: Redesigning an open source data portal to meet the needs of oceanographers.
description: 'Case study: redesigning Simons CMAP, an open source data portal for oceanographers, from usability study to hi-fidelity prototype.'
intro:
- Simons CMAP is a data portal that houses large ocean science datasets. The platform also supports data visualisation based on region, date, and other similar variables.
- The project that started as a user study with a group of UX Researchers, evolved into a passion project in which I redesigned the data portal.
