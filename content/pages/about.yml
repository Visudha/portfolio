heading: I’m Visudha, an engineer turned product designer, who wants to design intentional, inclusive, and human-centered experiences.
intro: I leverage my technical background and systems thinking to strategically break down problems and create digital experiences that are seamless and intuitive. I’m passionate about advocating for users, designing for complex systems, and cross-cultural design.
